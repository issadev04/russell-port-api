<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservations - Port de plaisance Russell</title>
</head>

<body>
    <h1>Gestion des réservations</h1>

    <!-- Lien de retour au tableau de bord. -->
    <p>
        <a href="/dashboard.html">Retour au tableau de bord</a>
    </p>

    <!-- Sélection du catway dont on souhaite consulter les réservations. -->
    <h2>Choisir un catway</h2>

    <input
        type="number"
        id="catwayNumber"
        placeholder="Numéro du catway"
    >

    <button id="loadReservations">Afficher les réservations</button>

    <!-- Formulaire d'ajout d'une réservation. -->
    <h2>Ajouter une réservation</h2>

    <form id="createReservationForm">
        <label for="createCatwayNumber">Catway :</label>
        <input type="number" id="createCatwayNumber" required>

        <label for="clientName">Client :</label>
        <input type="text" id="clientName" required>

        <label for="boatName">Bateau :</label>
        <input type="text" id="boatName" required>

        <label for="startDate">Date de début :</label>
        <input type="date" id="startDate" required>

        <label for="endDate">Date de fin :</label>
        <input type="date" id="endDate" required>

        <button type="submit">Ajouter</button>
    </form>

    <!-- Message affiché après une tentative d'ajout. -->
    <p id="message"></p>

    <!-- Formulaire de modification d'une réservation existante. -->
    <h2>Modifier une réservation</h2>

    <form id="updateReservationForm">
        <label for="updateId">ID de la réservation :</label>
        <input type="text" id="updateId" required>

        <label for="updateCatwayNumber">Catway :</label>
        <input type="number" id="updateCatwayNumber" required>

        <label for="updateClientName">Client :</label>
        <input type="text" id="updateClientName" required>

        <label for="updateBoatName">Bateau :</label>
        <input type="text" id="updateBoatName" required>

        <label for="updateStartDate">Date de début :</label>
        <input type="date" id="updateStartDate" required>

        <label for="updateEndDate">Date de fin :</label>
        <input type="date" id="updateEndDate" required>

        <button type="submit">Modifier</button>
    </form>

    <!-- Message affiché après une tentative de modification. -->
    <p id="updateMessage"></p>

    <!-- Tableau contenant les réservations du catway sélectionné. -->
    <h2>Liste des réservations</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Catway</th>
                <th>Client</th>
                <th>Bateau</th>
                <th>Début</th>
                <th>Fin</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="reservations"></tbody>
    </table>

    <script>
        // Déclenche le chargement des réservations au clic sur le bouton.
        document
            .getElementById("loadReservations")
            .addEventListener("click", loadReservations);

        /**
         * Récupère et affiche les réservations d'un catway.
         */
        async function loadReservations() {
            // Récupère le numéro du catway saisi par l'utilisateur.
            const catwayNumber =
                document.getElementById("catwayNumber").value;

            // Demande un numéro de catway avant de poursuivre.
            if (!catwayNumber) {
                alert("Indique un numéro de catway");
                return;
            }

            // Interroge l'API pour récupérer les réservations du catway.
            const response = await fetch(
                `/catways/${catwayNumber}/reservations`,
                {
                    credentials: "include"
                }
            );

            // Redirige vers la page d'accueil si la requête échoue.
            if (!response.ok) {
                window.location.href = "/";
                return;
            }

            // Convertit la réponse de l'API en données JavaScript.
            const reservations = await response.json();

            // Récupère le tableau et efface son contenu précédent.
            const table = document.getElementById("reservations");
            table.innerHTML = "";

            // Ajoute une ligne pour chaque réservation reçue.
            reservations.forEach(reservation => {
                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${reservation._id}</td>
                    <td>${reservation.catwayNumber}</td>
                    <td>${reservation.clientName}</td>
                    <td>${reservation.boatName}</td>
                    <td>${reservation.startDate.substring(0, 10)}</td>
                    <td>${reservation.endDate.substring(0, 10)}</td>
                    <td>
                        <button onclick="deleteReservation('${reservation._id}', ${reservation.catwayNumber})">
                            Supprimer
                        </button>
                    </td>
                `;

                table.appendChild(row);
            });
        }

        // Gère l'envoi du formulaire de création d'une réservation.
        document
            .getElementById("createReservationForm")
            .addEventListener("submit", async (event) => {
                // Empêche le rechargement automatique de la page.
                event.preventDefault();

                // Récupère le numéro du catway concerné.
                const catwayNumber =
                    document.getElementById("createCatwayNumber").value;

                // Envoie une requête POST pour créer la réservation.
                const response = await fetch(
                    `/catways/${catwayNumber}/reservations`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            catwayNumber: Number(catwayNumber),
                            clientName:
                                document.getElementById("clientName").value,
                            boatName:
                                document.getElementById("boatName").value,
                            startDate:
                                document.getElementById("startDate").value,
                            endDate:
                                document.getElementById("endDate").value
                        })
                    }
                );

                // Récupère le résultat de la création.
                const data = await response.json();

                // Affiche le message retourné par l'API.
                document.getElementById("message").textContent =
                    data.message || (
                        response.ok
                            ? "Réservation ajoutée"
                            : "Erreur lors de la création"
                    );

                // Recharge les réservations si la création a réussi.
                if (response.ok) {
                    document.getElementById("catwayNumber").value =
                        catwayNumber;

                    await loadReservations();
                }
            });

        // Gère l'envoi du formulaire de modification d'une réservation.
        document
            .getElementById("updateReservationForm")
            .addEventListener("submit", async (event) => {
                // Empêche le rechargement automatique de la page.
                event.preventDefault();

                // Récupère le numéro du catway concerné.
                const catwayNumber =
                    document.getElementById("updateCatwayNumber").value;

                // Récupère l'identifiant de la réservation à modifier.
                const idReservation =
                    document.getElementById("updateId").value.trim();

                // Envoie une requête PUT pour modifier la réservation.
                const response = await fetch(
                    `/catways/${catwayNumber}/reservations/${idReservation}`,
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "include",
                        body: JSON.stringify({
                            catwayNumber: Number(catwayNumber),
                            clientName:
                                document.getElementById("updateClientName").value,
                            boatName:
                                document.getElementById("updateBoatName").value,
                            startDate:
                                document.getElementById("updateStartDate").value,
                            endDate:
                                document.getElementById("updateEndDate").value
                        })
                    }
                );

                // Récupère le résultat de la modification.
                const data = await response.json();

                // Affiche le message retourné par l'API.
                document.getElementById("updateMessage").textContent =
                    data.message || (
                        response.ok
                            ? "Réservation modifiée"
                            : "Erreur lors de la modification"
                    );

                // Recharge les réservations si la modification a réussi.
                if (response.ok) {
                    document.getElementById("catwayNumber").value =
                        catwayNumber;

                    await loadReservations();
                }
            });

        /**
         * Supprime une réservation.
         *
         * @param {string} idReservation - Identifiant de la réservation.
         * @param {number} catwayNumber - Numéro du catway associé.
         */
        async function deleteReservation(idReservation, catwayNumber) {
            // Envoie une requête DELETE pour supprimer la réservation.
            const response = await fetch(
                `/catways/${catwayNumber}/reservations/${idReservation}`,
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );

            // Récupère le résultat de la suppression.
            const data = await response.json();

            // Affiche le message retourné par l'API.
            alert(data.message || (
                response.ok
                    ? "Réservation supprimée"
                    : "Erreur lors de la suppression"
            ));

            // Actualise la liste si la suppression a réussi.
            if (response.ok) {
                await loadReservations();
            }
        }
    </script>
</body>

</html>
