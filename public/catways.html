<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catways - Port de plaisance Russell</title>
</head>

<body>
    <h1>Gestion des catways</h1>

    <p>
        <a href="/dashboard.html">Retour au tableau de bord</a>
    </p>

    <!-- Liste des catways enregistrés. -->
    <h2>Liste des catways</h2>

    <!-- Formulaire d'ajout d'un catway. -->
    <h2>Ajouter un catway</h2>

    <form id="createCatwayForm">
        <label for="catwayNumber">Numéro :</label>
        <input type="number" id="catwayNumber" required>

        <label for="catwayType">Type :</label>
        <select id="catwayType" required>
            <option value="short">short</option>
            <option value="long">long</option>
        </select>

        <label for="catwayState">État :</label>
        <input type="text" id="catwayState" required>

        <button type="submit">Ajouter</button>
    </form>

    <!-- Formulaire de modification de l'état d'un catway. -->
    <h2>Modifier un catway</h2>

    <form id="updateCatwayForm">
        <label for="updateCatwayNumber">Numéro :</label>
        <input type="number" id="updateCatwayNumber" required>

        <label for="updateCatwayState">Nouvel état :</label>
        <input type="text" id="updateCatwayState" required>

        <button type="submit">Modifier</button>
    </form>

    <!-- Messages affichés après les opérations. -->
    <p id="updateMessage"></p>
    <p id="message"></p>

    <!-- Tableau affichant les catways et leurs actions. -->
    <table border="1">
        <thead>
            <tr>
                <th>Numéro</th>
                <th>Type</th>
                <th>État</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="catways"></tbody>
    </table>

    <script>
        // Récupère la liste des catways depuis l'API.
        fetch("/catways", {
            credentials: "include"
        })
            .then(response => {
                // Redirige vers la page d'accueil si la requête échoue.
                if (!response.ok) {
                    window.location.href = "/";
                    return;
                }

                return response.json();
            })
            .then(catways => {
                // Arrête le traitement si aucune donnée n'a été reçue.
                if (!catways) return;

                // Récupère le corps du tableau.
                const table = document.getElementById("catways");

                // Ajoute une ligne pour chaque catway.
                catways.forEach(catway => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${catway.catwayNumber}</td>
                        <td>${catway.catwayType}</td>
                        <td>${catway.catwayState}</td>
                        <td>
                            <button onclick="deleteCatway(${catway.catwayNumber})">
                                Supprimer
                            </button>
                        </td>
                    `;

                    table.appendChild(row);
                });
            });

        // Gère l'ajout d'un catway.
        document.getElementById("createCatwayForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            // Récupère les valeurs saisies dans le formulaire.
            const catwayNumber = document.getElementById("catwayNumber").value;
            const catwayType = document.getElementById("catwayType").value;
            const catwayState = document.getElementById("catwayState").value;

            // Envoie une requête POST pour créer le catway.
            const response = await fetch("/catways", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    catwayNumber: Number(catwayNumber),
                    catwayType,
                    catwayState
                })
            });

            // Récupère le résultat de l'opération.
            const data = await response.json();

            // Affiche le message retourné par l'API.
            document.getElementById("message").textContent =
                data.message || "Catway ajouté";

            // Recharge la page si la création a réussi.
            if (response.ok) {
                location.reload();
            }
        });

        // Gère la modification de l'état d'un catway.
        document.getElementById("updateCatwayForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            // Récupère le numéro du catway et son nouvel état.
            const catwayNumber = document.getElementById("updateCatwayNumber").value;
            const catwayState = document.getElementById("updateCatwayState").value;

            // Envoie une requête PUT pour modifier le catway.
            const response = await fetch(`/catways/${catwayNumber}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    catwayState
                })
            });

            // Récupère le résultat de l'opération.
            const data = await response.json();

            // Affiche le message retourné par l'API.
            document.getElementById("updateMessage").textContent =
                data.message || "Catway modifié";

            // Recharge la page si la modification a réussi.
            if (response.ok) {
                location.reload();
            }
        });

        /**
         * Supprime un catway à partir de son numéro.
         *
         * @param {number} catwayNumber - Numéro du catway à supprimer.
         */
        async function deleteCatway(catwayNumber) {
            // Envoie une requête DELETE pour supprimer le catway.
            const response = await fetch(`/catways/${catwayNumber}`, {
                method: "DELETE",
                credentials: "include"
            });

            // Récupère le résultat de l'opération.
            const data = await response.json();

            // Affiche le message retourné par l'API.
            alert(data.message || "Catway supprimé");

            // Recharge la page si la suppression a réussi.
            if (response.ok) {
                location.reload();
            }
        }
    </script>
</body>

</html>
